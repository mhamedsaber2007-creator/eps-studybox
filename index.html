<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPS StudyBox</title>
<meta name="theme-color" content="#153e35">
<style>
:root{--green:#153e35;--green2:#2a5b4e;--gold:#d6a666;--bg:#f5faef;--ink:#17231f;--muted:#66795e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:var(--green);color:#fff;padding:10px}
.wrap{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.brand{font-weight:bold}.toolbar{display:flex;gap:8px;padding:12px;background:#fff;flex-wrap:wrap}
input,button{padding:8px 12px;border-radius:8px;border:1px solid #ccc}
button.primary{background:var(--green);color:#fff;border:none;cursor:pointer}
button.soft{background:#eef5e8;border:1px solid #cfe3c2}
.syncbar{display:flex;gap:10px;align-items:center;background:#fff;padding:10px;margin:10px;border-radius:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:10px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.muted{color:var(--muted)} #status{font-weight:bold}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">ETUDE • ORGANISATION • RÉVISION</div><div>EPS StudyBox</div></div></header>
<div class="toolbar">
<input id="search" placeholder="قلب على موديل...">
<button class="primary" id="addModule">+ إضافة موديل</button>
<button class="soft" id="exportBtn">تصدير</button>
</div>
<div class="syncbar">
<div id="syncEmail">غير مربوط - محلي فقط - سجل الدخول لحفظ بياناتك</div>
<div id="syncStatus" class="muted">محلي</div>
<div id="total" class="muted"></div>
<button id="loginBtn" class="primary">ربط Google ✅</button>
<button id="logoutBtn" class="soft" style="display:none">خروج</button>
</div>
<main class="wrap"><div id="cards" class="cards"></div><div id="empty" style="padding:20px">لا يوجد موديلات بعد - اضف واحد</div></main>

<script type="module">
// ========= FIREBASE CONFIG - BDL HNA B DYALK =========
const firebaseConfig = {
  apiKey: "AIzaSyA-PLACEHOLDER-BDL-B-DYALK",
  authDomain: "eps-studybox.firebaseapp.com",
  projectId: "eps-studybox",
  storageBucket: "eps-studybox.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123:web:abc"
};
// Sir l: https://console.firebase.google.com/project/eps-studybox/settings/general
// w copier Config dyalk w dir paste hna ^^^^

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let modules = JSON.parse(localStorage.getItem('eps_modules')||'[]');

function render(){
  const cards = document.getElementById('cards');
  const empty = document.getElementById('empty');
  document.getElementById('total').innerText = modules.length + ' module(s)';
  if(!modules.length){cards.innerHTML=''; empty.style.display='block'; return;}
  empty.style.display='none';
  cards.innerHTML = modules.map(m=>`<div class="card"><h3>${m.name}</h3><p class="muted">${m.desc||''}</p><button onclick="deleteModule('${m.id}')">حذف</button></div>`).join('');
}
window.deleteModule = async (id)=>{
  modules = modules.filter(x=>x.id!=id);
  localStorage.setItem('eps_modules', JSON.stringify(modules));
  render();
  if(currentUser){ await deleteDoc(doc(db, 'users', currentUser.uid, 'modules', id)); }
}

document.getElementById('addModule').onclick = async ()=>{
  const name = prompt('اسم الموديل:'); if(!name) return;
  const mod = {id:Date.now().toString(), name, desc:''};
  modules.push(mod);
  localStorage.setItem('eps_modules', JSON.stringify(modules));
  render();
  if(currentUser){ await setDoc(doc(db, 'users', currentUser.uid, 'modules', mod.id), mod); }
};

// ==== LOGIN JDID KAYKHDEM 100% ====
document.getElementById('loginBtn').onclick = ()=>{
  console.log('kanmchi l Google...');
  signInWithRedirect(auth, provider);
};

document.getElementById('logoutBtn').onclick = ()=> signOut(auth);

getRedirectResult(auth).then(res=>{
  if(res) console.log('Rja3na mn Google', res.user.email);
}).catch(e=>{ alert('Erreur login: '+e.message); console.error(e); });

onAuthStateChanged(auth, async (user)=>{
  if(user){
    currentUser = user;
    document.getElementById('syncEmail').innerHTML = 'مربوط: ' + user.email + ' ✅';
    document.getElementById('syncStatus').innerText = 'مزامنة';
    document.getElementById('loginBtn').style.display='none';
    document.getElementById('logoutBtn').style.display='inline-block';
    // jib data mn Firebase
    try{
      const snap = await getDocs(collection(db, 'users', user.uid, 'modules'));
      if(!snap.empty){
        modules = snap.docs.map(d=>d.data());
        localStorage.setItem('eps_modules', JSON.stringify(modules));
        render();
      }
    }catch(e){console.error(e)}
  }else{
    currentUser = null;
    document.getElementById('syncEmail').innerText = 'غير مربوط - محلي فقط';
    document.getElementById('syncStatus').innerText = 'محلي';
    document.getElementById('loginBtn').style.display='inline-block';
    document.getElementById('logoutBtn').style.display='none';
  }
});

render();
</script>
</body>
</html>
